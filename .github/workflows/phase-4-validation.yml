name: Phase 4 - Statistical validation

on:
  workflow_dispatch:
    inputs:
      phase3_run_id:
        description: 'Completed GitHub Actions run ID containing phase-3-backtest-results'
        required: true
      out_dir:
        description: 'Validation output directory'
        required: true
        default: results/phase4

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Phase 3 results from the selected run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/phase3
          gh run download "${{ inputs.phase3_run_id }}"             --repo "${{ github.repository }}"             --name phase-3-backtest-results             --dir results/phase3
      - name: Verify selected-trade ledger
        run: |
          test -s results/phase3/selected_trades.parquet
          python - <<'PY'
          import pandas as pd
          p = "results/phase3/selected_trades.parquet"
          df = pd.read_parquet(p)
          assert not df.empty, "Phase 3 selected-trade ledger is empty"
          assert {"entry_timestamp","net_pnl_inr"}.issubset(df.columns)
          print(df.head(5).to_string())
          print("trades:", len(df))
          PY
      - name: Install dependencies
        run: pip install 'pandas>=2.2' 'pyarrow>=18' 'numpy>=2.0'
      - name: Validate selected trades
        run: python scripts/validate_results.py --trades results/phase3/selected_trades.parquet --out-dir "${{ inputs.out_dir }}"
      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-validation
          path: "${{ inputs.out_dir }}"
