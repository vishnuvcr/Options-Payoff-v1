name: Phase 4 - Statistical validation

on:
  push:
    branches: [phase-4-validation]
    paths: ['.github/phase4_trigger.json']
  workflow_dispatch:
    inputs:
      phase3_run_id:
        description: 'Completed Phase 3 workflow run ID containing phase-3-backtest-results'
        required: true
      phase2_run_id:
        description: 'Completed Phase 2 workflow run ID containing phase-2-strategy-inputs'
        required: true
      out_dir:
        description: 'Validation output directory'
        required: true
        default: results/phase4

permissions:
  actions: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve execution parameters
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "PHASE3_RUN_ID=$(python -c 'import json; print(json.load(open(".github/phase4_trigger.json"))["phase3_run_id"])')" >> "$GITHUB_ENV"
            echo "PHASE2_RUN_ID=$(python -c 'import json; print(json.load(open(".github/phase4_trigger.json"))["phase2_run_id"])')" >> "$GITHUB_ENV"
            echo "OUT_DIR=results/phase4" >> "$GITHUB_ENV"
          else
            echo "PHASE3_RUN_ID=${{ inputs.phase3_run_id }}" >> "$GITHUB_ENV"
            echo "PHASE2_RUN_ID=${{ inputs.phase2_run_id }}" >> "$GITHUB_ENV"
            echo "OUT_DIR=${{ inputs.out_dir }}" >> "$GITHUB_ENV"
          fi
      - name: Download Phase 3 results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/phase3
          gh run download "$PHASE3_RUN_ID" --repo "${{ github.repository }}" --name phase-3-backtest-results --dir results/phase3
          test -s results/phase3/selected_trades.parquet
      - name: Download Phase 2 strategy inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/derived
          gh run download "$PHASE2_RUN_ID" --repo "${{ github.repository }}" --name phase-2-strategy-inputs --dir data/derived
          test -s data/derived/strategy_inputs.parquet
      - name: Install dependencies
        run: pip install 'pandas>=2.2' 'pyarrow>=18' 'numpy>=2.0'
      - name: Validate selected trades
        run: python scripts/validate_results.py --trades results/phase3/selected_trades.parquet --out-dir "$OUT_DIR"
      - name: Run robustness and sensitivity analysis
        run: |
          python scripts/run_robustness.py \
            --inputs data/derived/strategy_inputs.parquet \
            --out-dir "$OUT_DIR/robustness" \
            --slippages '0,0.001,0.0025,0.005,0.01' \
            --thresholds '1,1.5,2,2.5,3,4,5' \
            --denominators 'buy_premium,spot_notional'
      - name: Run Paytm Money brokerage sensitivity
        run: |
          python scripts/run_brokerage_sensitivity.py \
            --trades results/phase3/selected_trades.parquet \
            --out "$OUT_DIR/brokerage_sensitivity.csv" \
            --baseline-brokerage 20 \
            --rates '10,20,40'
      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-validation
          path: results/phase4
      - name: Chain to Phase 5
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run phase-5-regimes.yml --repo "${{ github.repository }}" --ref phase-5-regimes -f phase3_run_id="$PHASE3_RUN_ID" -f regimes_path="" -f output_path="results/phase5_regime_summary.csv"
