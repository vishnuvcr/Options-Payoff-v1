name: Phase 4 - Statistical validation

on:
  push:
    branches: [phase-4-validation]
    paths: ['.github/phase3_trigger.json']
  workflow_dispatch:
    inputs:
      phase3_run_id:
        description: 'Completed Phase 3 workflow run ID containing phase-3-backtest-results'
        required: true
      out_dir:
        description: 'Validation output directory'
        required: true
        default: results/phase4

permissions:
  actions: read
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve execution parameters
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "PHASE3_RUN_ID=$(python -c 'import json; print(json.load(open(".github/phase3_trigger.json"))["phase3_run_id"])')" >> "$GITHUB_ENV"
          else
            echo "PHASE3_RUN_ID=${{ inputs.phase3_run_id }}" >> "$GITHUB_ENV"
          fi
      - name: Download Phase 3 results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/phase3
          gh run download "$PHASE3_RUN_ID" --repo "${{ github.repository }}" --name phase-3-backtest-results --dir results/phase3
          test -s results/phase3/selected_trades.parquet
      - name: Install dependencies
        run: pip install 'pandas>=2.2' 'pyarrow>=18' 'numpy>=2.0'
      - name: Validate selected trades
        run: python scripts/validate_results.py --trades results/phase3/selected_trades.parquet --out-dir "${{ inputs.out_dir }}"
      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-validation
          path: "${{ inputs.out_dir }}"
      - name: Chain to Phase 5
        if: success()
        run: |
          git fetch origin phase-5-regimes
          git switch --detach origin/phase-5-regimes
          printf '{"phase3_run_id":"%s"}\n' "$PHASE3_RUN_ID" > .github/phase3_trigger.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/phase3_trigger.json
          git commit -m "Trigger Phase 5 from Phase 4 run ${GITHUB_RUN_ID}"
          git push origin HEAD:phase-5-regimes
