name: Phase 3 - Backtest

on:
  push:
    branches: [phase-3-backtest]
    paths: ['.github/phase2_trigger.json']
  workflow_dispatch:
    inputs:
      phase2_run_id:
        description: 'Completed Phase 2 workflow run ID containing phase-2-strategy-inputs'
        required: false
        default: ''

      start:
        description: Start date (YYYY-MM-DD)
        required: true
        default: '2025-11-01'
      end:
        description: End date (YYYY-MM-DD)
        required: true
        default: '2026-08-31'
      trigger_base:
        description: Trigger denominator mode
        required: true
        default: buy_premium
        type: choice
        options:
          - buy_premium
          - spot_notional
          - configured_capital
      configured_capital_per_lot:
        description: Required only for configured_capital mode
        required: false
        default: ''
      slippage_pct:
        description: Relative slippage per option premium, e.g. 0.0025
        required: true
        default: '0.0025'

permissions:
  actions: read
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve execution parameters
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "PHASE2_RUN_ID=$(python -c 'import json; print(json.load(open(".github/phase2_trigger.json"))["phase2_run_id"])')" >> "$GITHUB_ENV"
            echo "START_DATE=$(python -c 'import json; print(json.load(open(".github/phase2_trigger.json"))["start_date"])')" >> "$GITHUB_ENV"
            echo "END_DATE=$(python -c 'import json; print(json.load(open(".github/phase2_trigger.json"))["end_date"])')" >> "$GITHUB_ENV"
            echo "TRIGGER_BASE=$(python -c 'import json; print(json.load(open(".github/phase2_trigger.json"))["trigger_base"])')" >> "$GITHUB_ENV"
            echo "CONFIGURED_CAPITAL=$(python -c 'import json; print(json.load(open(".github/phase2_trigger.json"))["configured_capital"])')" >> "$GITHUB_ENV"
            echo "SLIPPAGE_PCT=$(python -c 'import json; print(json.load(open(".github/phase2_trigger.json"))["slippage_pct"])')" >> "$GITHUB_ENV"
          else
            echo "PHASE2_RUN_ID=${{ inputs.phase2_run_id }}" >> "$GITHUB_ENV"
            echo "START_DATE=${{ inputs.start }}" >> "$GITHUB_ENV"
            echo "END_DATE=${{ inputs.end }}" >> "$GITHUB_ENV"
            echo "TRIGGER_BASE=${{ inputs.trigger_base }}" >> "$GITHUB_ENV"
            echo "CONFIGURED_CAPITAL=${{ inputs.configured_capital_per_lot }}" >> "$GITHUB_ENV"
            echo "SLIPPAGE_PCT=${{ inputs.slippage_pct }}" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'huggingface_hub>=0.34' 'pandas>=2.2' 'pyarrow>=18'
      - name: Restore/cache Hugging Face source files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-v3
          restore-keys: hf-nifty-options-v3-
      - name: Acquire Phase 2 strategy inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/derived
          if [ -n "$PHASE2_RUN_ID" ]; then
            gh run download "$PHASE2_RUN_ID" --repo "${{ github.repository }}" --name phase-2-strategy-inputs --dir data/derived
            test -s data/derived/strategy_inputs.parquet
          else
            python scripts/extract_strategy_inputs.py \
              --start "$START_DATE" \
              --end "$END_DATE" \
              --entry-time '09:20' \
              --out data/derived/strategy_inputs.parquet
          fi
      - name: Run backtest
        run: |
          EXTRA=''
          if [ "$TRIGGER_BASE" = 'configured_capital' ]; then EXTRA="--configured-capital-per-lot '$CONFIGURED_CAPITAL'"; fi
          python scripts/run_backtest.py \
            --inputs data/derived/strategy_inputs.parquet \
            --out-dir results/phase3 \
            --threshold-pct '2.5' \
            --trigger-base-mode "$TRIGGER_BASE" \
            --slippage-pct "$SLIPPAGE_PCT" $EXTRA
      - name: Run unit tests
        run: python -m unittest tests/test_costs.py -v
      - name: Upload Phase 3 results
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-backtest-results
          path: results/phase3
      - name: Chain to Phase 4
        if: success()
        run: |
          git fetch origin phase-4-validation
          git switch --detach origin/phase-4-validation
          printf '{"phase3_run_id":"%s"}\n' "${GITHUB_RUN_ID}" > .github/phase3_trigger.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/phase3_trigger.json
          git commit -m "Trigger Phase 4 from Phase 3 run ${GITHUB_RUN_ID}"
          git push origin HEAD:phase-4-validation
