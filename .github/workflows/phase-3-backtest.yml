name: Phase 3 - Backtest

on:
  push:
    branches: [phase-3-backtest]
    paths: ['.github/phase2_trigger.json']
  workflow_dispatch:
    inputs:
      phase2_run_id:
        description: 'Completed Phase 2 workflow run ID containing phase-2-strategy-inputs'
        required: false
        default: ''
      start:
        description: Start date (YYYY-MM-DD)
        required: true
        default: '2025-11-01'
      end:
        description: End date (YYYY-MM-DD)
        required: true
        default: '2026-08-31'
      trigger_base:
        description: Trigger denominator mode
        required: true
        default: buy_premium
        type: choice
        options:
          - buy_premium
          - spot_notional
          - configured_capital
      configured_capital_per_lot:
        description: Required only for configured_capital mode
        required: false
        default: ''
      slippage_pct:
        description: Relative slippage per option premium, e.g. 0.0025
        required: true
        default: '0.0025'

permissions:
  actions: write
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'huggingface_hub>=0.34' 'pandas>=2.2' 'pyarrow>=18'
      - name: Restore/cache Hugging Face source files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-v3-${{ inputs.start }}-${{ inputs.end }}
          restore-keys: hf-nifty-options-v3-
      - name: Acquire Phase 2 strategy inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/derived
          if [ -n "${{ inputs.phase2_run_id }}" ]; then
            gh run download "${{ inputs.phase2_run_id }}" --repo "${{ github.repository }}" --name phase-2-strategy-inputs --dir data/derived
            test -s data/derived/strategy_inputs.parquet
          else
            python scripts/extract_strategy_inputs.py \
              --start '${{ inputs.start }}' \
              --end '${{ inputs.end }}' \
              --entry-time '09:20' \
              --out data/derived/strategy_inputs.parquet
          fi
      - name: Run backtest
        run: |
          EXTRA=''
          if [ '${{ inputs.trigger_base }}' = 'configured_capital' ]; then EXTRA="--configured-capital-per-lot '${{ inputs.configured_capital_per_lot }}'"; fi
          python scripts/run_backtest.py \
            --inputs data/derived/strategy_inputs.parquet \
            --out-dir results/phase3 \
            --threshold-pct '2.5' \
            --trigger-base-mode '${{ inputs.trigger_base }}' \
            --slippage-pct '${{ inputs.slippage_pct }}' $EXTRA
      - name: Run unit tests
        run: python -m unittest tests/test_costs.py -v
      - name: Upload Phase 3 results
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-backtest-results
          path: results/phase3
      - name: Chain to Phase 4
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run phase-4-validation.yml --repo "${{ github.repository }}" --ref phase-4-validation -f phase3_run_id="${{ github.run_id }}" -f out_dir="results/phase4"
