name: Phase 3 - Backtest

concurrency:
  group: phase-3-strike-grid
  cancel-in-progress: true

on:
  push:
    branches:
      - phase-3-strike-grid
  workflow_dispatch:
    inputs:
      phase2_run_id:
        description: 'Optional completed Phase 2 run ID containing phase-2-strategy-inputs'
        required: false
        default: ''
      start:
        description: Start date (YYYY-MM-DD), used when phase2_run_id is empty
        required: true
        default: '2025-11-01'
      end:
        description: End date (YYYY-MM-DD), used when phase2_run_id is empty
        required: true
        default: '2026-08-31'
      trigger_base:
        description: Trigger denominator mode
        required: true
        default: buy_premium
        type: choice
        options:
          - buy_premium
          - spot_notional
          - configured_capital
      configured_capital_per_lot:
        description: Required only for configured_capital mode
        required: false
        default: ''
      slippage_pct:
        description: Relative slippage per option premium, e.g. 0.0025
        required: true
        default: '0.0025'

permissions:
  actions: read
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'huggingface_hub>=0.34' 'pandas>=2.2' 'pyarrow>=18'
      - name: Restore Hugging Face source cache
        if: inputs.phase2_run_id == ''
        id: hf_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-v1-${{ inputs.start || '2021-06-01' }}-${{ inputs.end || '2026-08-31' }}
          restore-keys: hf-nifty-options-v1-
      - name: Download Phase 2 strategy inputs from selected run
        if: inputs.phase2_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/derived
          gh run download "${{ inputs.phase2_run_id }}" --repo "${{ github.repository }}" --name phase-2-strategy-inputs --dir data/derived
          test -s data/derived/strategy_inputs.parquet
      - name: Build Phase 2 strategy inputs when no Phase 2 run ID is supplied
        if: inputs.phase2_run_id == ''
        id: build_phase2
        run: |
          START='${{ inputs.start }}'
          END='${{ inputs.end }}'
          [ -n "$START" ] || START='2021-06-01'
          [ -n "$END" ] || END='2026-08-31'
          python scripts/extract_strategy_inputs.py --start "$START" --end "$END" --entry-time '09:20' --out data/derived/strategy_inputs.parquet
      - name: Save Hugging Face source cache
        if: inputs.phase2_run_id == '' && steps.hf_cache_restore.outputs.cache-hit != 'true' && steps.build_phase2.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-v1-${{ inputs.start || '2021-06-01' }}-${{ inputs.end || '2026-08-31' }}

      - name: Upload expanded Phase 3 inputs
        if: steps.build_phase2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-expanded-strategy-inputs
          path: |
            data/derived/strategy_inputs.parquet
            data/derived/strategy_inputs.metadata.json

      - name: Run backtest
        run: |
          TRIGGER='${{ inputs.trigger_base }}'
          SLIP='${{ inputs.slippage_pct }}'
          [ -n "$TRIGGER" ] || TRIGGER='buy_premium'
          [ -n "$SLIP" ] || SLIP='0.0025'
          EXTRA=''
          if [ "$TRIGGER" = 'configured_capital' ]; then
            EXTRA="--configured-capital-per-lot '${{ inputs.configured_capital_per_lot }}'"
          fi
          python scripts/run_backtest.py --inputs data/derived/strategy_inputs.parquet --out-dir results/phase3 --threshold-pct '2.5' --trigger-base-mode "$TRIGGER" --slippage-pct "$SLIP" --fallback-max-shift-points '500' --fallback-step-points '50' $EXTRA
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Upload Phase 3 results
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-backtest-results
          path: results/phase3
