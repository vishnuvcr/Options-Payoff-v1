name: Phase 9I - Top Two Strikes

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First calendar year to analyze
        required: true
        default: '2021'
      end_year:
        description: Last calendar year to analyze
        required: true
        default: '2026'
  push:
    branches:
      - phase-9I-top-two-strikes
    paths:
      - .github/workflows/phase-9I-top-two-strikes.yml
      - scripts/analyze_phase9i_top_two.py
      - scripts/merge_phase9i_top_two.py

permissions:
  actions: read
  contents: write

concurrency:
  group: phase9i-top-two-v1
  cancel-in-progress: true

jobs:
  yearly-analysis:
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pandas numpy scipy pyarrow huggingface_hub tabulate
      - name: Cache Phase 9G option data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase9i-top2-hf-${{ matrix.year }}-${{ hashFiles('scripts/analyze_phase9i_top_two.py') }}
          restore-keys: |
            phase9g-hf-options-${{ matrix.year }}-
            phase9h-loss-hf-${{ matrix.year }}-
            phase9i-top2-hf-${{ matrix.year }}-
      - name: Download frozen Phase 9G H1 control
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p baseline
          gh run download 36320697995 -n phase9g-run27-merged-results -D baseline
      - name: Download frozen Phase 9G scan audit for this year
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf phase9g_year
          gh run download 36313815542 -n phase9g-year-${{ matrix.year }} -D phase9g_year
      - name: Run top-two analysis
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/analyze_phase9i_top_two.py \
            --start "${{ matrix.year }}-01-01" \
            --end "${{ matrix.year }}-12-31" \
            --scan-audit phase9g_year/H1/intraday_scan_audit.parquet \
            --out-dir work/${{ matrix.year }} \
            --slippage-pct 0.0025 \
            --brokerage-per-order 20
      - name: Upload yearly top-two analysis
        uses: actions/upload-artifact@v4
        with:
          name: phase9i-top2-year-${{ matrix.year }}
          path: work/${{ matrix.year }}

  merge-results:
    needs: yearly-analysis
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pandas numpy tabulate
      - name: Download yearly top-two artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: phase9i-top2-year-*
          merge-multiple: false
          path: phase9i_evidence
      - name: Download frozen Phase 9G H1 control
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p baseline
          gh run download 36320697995 -n phase9g-run27-merged-results -D baseline
      - name: Merge and validate
        run: |
          python scripts/merge_phase9i_top_two.py \
            --input-dir phase9i_evidence \
            --baseline baseline/H1_realized_trades.csv \
            --out-dir results/phase9i
      - name: Upload Phase 9I results
        uses: actions/upload-artifact@v4
        with:
          name: phase-9I-top-two-strikes
          path: results/phase9i
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Persist Phase 9I results
        run: |
          git add results/phase9i
          if git diff --cached --quiet; then echo 'No result changes'; exit 0; fi
          git commit -m 'Add Phase 9I top-two strike analysis results'
          git fetch origin phase-9I-top-two-strikes
          git rebase origin/phase-9I-top-two-strikes
          git push origin phase-9I-top-two-strikes

# Phase 9I workflow trigger checkpoint
