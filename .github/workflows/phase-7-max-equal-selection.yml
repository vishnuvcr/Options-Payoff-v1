name: Phase 7 - Maximum Equal Max-Profit Max-Loss Selection

on:
  push:
    branches:
      - phase-7-max-equal-selection
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Phase 3 grid run containing phase-3-backtest-results
        required: true
        default: '36262958536'
      slippage_pct:
        description: Premium slippage per option leg
        required: true
        default: '0.0025'

permissions:
  actions: read
  contents: read

jobs:
  max-equal-selection:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '36262958536' }}
      SLIPPAGE_PCT: ${{ inputs.slippage_pct || '0.0025' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2' 'pyarrow>=18'

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Download authoritative Phase 3 candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/phase3_source
          gh run download "$SOURCE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name phase-3-backtest-results \
            --dir data/phase3_source
          test -s data/phase3_source/candidate_results.parquet

      - name: Run Phase 7 primary selection - maximum equal flatline value
        run: |
          python scripts/run_backtest.py \
            --inputs data/phase3_source/candidate_results.parquet \
            --out-dir results/phase7_primary \
            --slippage-pct "$SLIPPAGE_PCT" \
            --selection-mode max_equal_flatline \
            --selection-score equal_max_profit_loss_inr \
            --selection-max-shift-points 400 \
            --selection-step-points 50 \
            --min-equal-max-profit-loss-inr 0

      - name: Run Phase 7 sensitivity - maximum value with legacy 2.5 percent gate
        run: |
          python scripts/run_backtest.py \
            --inputs data/phase3_source/candidate_results.parquet \
            --out-dir results/phase7_legacy_25pct_gate \
            --slippage-pct "$SLIPPAGE_PCT" \
            --selection-mode max_equal_flatline \
            --selection-score equal_max_profit_loss_inr \
            --selection-max-shift-points 400 \
            --selection-step-points 50 \
            --min-equal-max-profit-loss-inr 0 \
            --min-chart-return-pct 2.5

      - name: Compare Phase 7 variants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("results")
          rows = []
          for name in ["phase7_primary", "phase7_legacy_25pct_gate"]:
              summary = json.loads((root / name / "summary.json").read_text())
              trades = pd.read_parquet(root / name / "selected_trades.parquet")
              shift_counts = trades["shift_points"].value_counts().sort_index().to_dict() if not trades.empty else {}
              rows.append({
                  "variant": name,
                  "selected_trades": len(trades),
                  "selected_entry_timestamps": int(trades["entry_timestamp"].nunique()) if not trades.empty else 0,
                  "total_net_pnl_inr": float(trades["net_pnl_inr"].sum()) if not trades.empty else 0.0,
                  "mean_net_pnl_inr": float(trades["net_pnl_inr"].mean()) if not trades.empty else None,
                  "win_rate_pct": float((trades["net_pnl_inr"] > 0).mean() * 100) if not trades.empty else None,
                  "mean_estimated_equal_max_profit_loss_inr": summary["mean_estimated_equal_max_profit_loss_inr"],
                  "max_estimated_equal_max_profit_loss_inr": summary["max_estimated_equal_max_profit_loss_inr"],
                  "shift_counts": shift_counts,
              })
          out = root / "phase7_comparison.json"
          out.write_text(json.dumps(rows, indent=2, default=str))
          print(out.read_text())
          PY

      - name: Upload Phase 7 results
        uses: actions/upload-artifact@v4
        with:
          name: phase-7-max-equal-selection
          path: |
            results/phase7_primary
            results/phase7_legacy_25pct_gate
            results/phase7_comparison.json
