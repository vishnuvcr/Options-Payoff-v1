name: Phase 5 - Regime Attribution

on:
  workflow_dispatch:
    inputs:
      trades_path:
        description: 'Path to Phase 3/4 trade ledger committed to the branch'
        required: true
        default: 'data/results/selected_trades.parquet'
      regimes_path:
        description: 'Optional point-in-time regime table (CSV/Parquet)'
        required: false
        default: ''
      output_path:
        description: 'Output CSV path'
        required: true
        default: 'data/results/phase5_regime_summary.csv'

jobs:
  regime-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas pyarrow
      - name: Check prerequisite ledger
        run: |
          test -f '${{ inputs.trades_path }}' || {
            echo 'Phase 5 requires a completed Phase 3/4 trade ledger.'
            exit 2
          }
      - name: Run regime attribution
        run: |
          if [ -n '${{ inputs.regimes_path }}' ]; then
            python scripts/analyze_regimes.py --trades '${{ inputs.trades_path }}' --regimes '${{ inputs.regimes_path }}' --out '${{ inputs.output_path }}'
          else
            python scripts/analyze_regimes.py --trades '${{ inputs.trades_path }}' --out '${{ inputs.output_path }}'
          fi
      - name: Upload Phase 5 result
        uses: actions/upload-artifact@v4
        with:
          name: phase-5-regime-summary
          path: '${{ inputs.output_path }}'