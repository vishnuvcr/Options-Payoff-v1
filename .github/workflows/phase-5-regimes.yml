name: Phase 5 - Regime Attribution

on:
  workflow_dispatch:
    inputs:
      phase3_run_id:
        description: 'Completed GitHub Actions run ID containing phase-3-backtest-results'
        required: true
      regimes_path:
        description: 'Optional point-in-time regime table committed to this branch (CSV/Parquet)'
        required: false
        default: ''
      output_path:
        description: 'Output CSV path'
        required: true
        default: results/phase5_regime_summary.csv

permissions:
  actions: read
  contents: read

jobs:
  regime-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download Phase 3 results from the selected run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/phase3
          gh run download "${{ inputs.phase3_run_id }}" --repo "${{ github.repository }}" --name phase-3-backtest-results --dir results/phase3
      - name: Check prerequisite ledger
        run: |
          test -s results/phase3/selected_trades.parquet || {
            echo 'Phase 5 requires a completed Phase 3 trade ledger.'
            exit 2
          }
      - name: Install dependencies
        run: python -m pip install pandas pyarrow
      - name: Run regime attribution
        run: |
          if [ -n "${{ inputs.regimes_path }}" ]; then
            test -f "${{ inputs.regimes_path }}"
            python scripts/analyze_regimes.py --trades results/phase3/selected_trades.parquet --regimes "${{ inputs.regimes_path }}" --out "${{ inputs.output_path }}"
          else
            python scripts/analyze_regimes.py --trades results/phase3/selected_trades.parquet --out "${{ inputs.output_path }}"
          fi
      - name: Upload Phase 5 result
        uses: actions/upload-artifact@v4
        with:
          name: phase-5-regime-summary
          path: "${{ inputs.output_path }}"
