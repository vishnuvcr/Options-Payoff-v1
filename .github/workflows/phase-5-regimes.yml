name: Phase 5 - Regime Attribution

on:
  push:
    branches: [phase-5-regimes]
    paths: ['.github/phase5_trigger.json']
  workflow_dispatch:
    inputs:
      phase3_run_id:
        description: 'Completed GitHub Actions run ID containing phase-3-backtest-results'
        required: true
      phase2_run_id:
        description: 'Completed Phase 2 workflow run ID containing phase-2-strategy-inputs'
        required: true
      regimes_path:
        description: 'Optional externally prepared point-in-time regime table (CSV/Parquet)'
        required: false
        default: ''
      output_path:
        description: 'Output CSV path'
        required: true
        default: results/phase5_regime_summary.csv

permissions:
  actions: read
  contents: read

jobs:
  regime-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve execution parameters
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "PHASE3_RUN_ID=$(python -c 'import json; print(json.load(open(".github/phase5_trigger.json"))["phase3_run_id"])')" >> "$GITHUB_ENV"
            echo "PHASE2_RUN_ID=$(python -c 'import json; print(json.load(open(".github/phase5_trigger.json"))["phase2_run_id"])')" >> "$GITHUB_ENV"
            echo "REGIMES_PATH=" >> "$GITHUB_ENV"
            echo "OUTPUT_PATH=results/phase5_regime_summary.csv" >> "$GITHUB_ENV"
          else
            echo "PHASE3_RUN_ID=${{ inputs.phase3_run_id }}" >> "$GITHUB_ENV"
            echo "PHASE2_RUN_ID=${{ inputs.phase2_run_id }}" >> "$GITHUB_ENV"
            echo "REGIMES_PATH=${{ inputs.regimes_path }}" >> "$GITHUB_ENV"
            echo "OUTPUT_PATH=${{ inputs.output_path }}" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: python -m pip install pandas pyarrow
      - name: Download Phase 3 results from the selected run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/phase3
          gh run download "$PHASE3_RUN_ID" --repo "${{ github.repository }}" --name phase-3-backtest-results --dir results/phase3
      - name: Download Phase 2 strategy inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/derived
          gh run download "$PHASE2_RUN_ID" --repo "${{ github.repository }}" --name phase-2-strategy-inputs --dir data/derived
          test -s data/derived/strategy_inputs.parquet
      - name: Build point-in-time spot regimes
        run: |
          python scripts/build_spot_regimes.py --inputs data/derived/strategy_inputs.parquet --out data/derived/spot_regimes.csv
      - name: Check prerequisite ledger
        run: |
          test -s results/phase3/selected_trades.parquet || {
            echo 'Phase 5 requires a completed Phase 3 trade ledger.'
            exit 2
          }
      - name: Run regime attribution
        run: |
          if [ -n "$REGIMES_PATH" ]; then
            test -f "$REGIMES_PATH"
            python scripts/analyze_regimes.py --trades results/phase3/selected_trades.parquet --regimes "$REGIMES_PATH" --out "$OUTPUT_PATH"
          else
            python scripts/analyze_regimes.py --trades results/phase3/selected_trades.parquet --regimes data/derived/spot_regimes.csv --out "$OUTPUT_PATH"
          fi
      - name: Upload Phase 5 result
        uses: actions/upload-artifact@v4
        with:
          name: phase-5-regime-summary
          path: "$OUTPUT_PATH"
