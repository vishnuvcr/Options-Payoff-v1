name: Phase 9D - Intraday Recheck Near-Expiry Strategy (Chunked)

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start date YYYY-MM-DD
        required: true
        default: '2021-06-01'
      end:
        description: End date YYYY-MM-DD
        required: true
        default: '2026-08-31'
      slippage_pct:
        description: Premium slippage as decimal
        required: true
        default: '0.0025'
      brokerage_per_order:
        description: Brokerage per executed order in INR
        required: true
        default: '20'
  push:
    branches:
      - phase-9D-intraday-recheck-correction
    paths:
      - .github/workflows/phase-9D-intraday-recheck-chunked.yml
      - scripts/extract_intraday_near_exit_strategy.py
      - scripts/merge_intraday_chunks.py
      - scripts/run_intraday_near_exit_backtest.py
      - src/intraday_selection.py
      - tests/test_intraday_selection.py

concurrency:
  group: phase-9d-intraday-chunked-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chunks:
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-9D-intraday-recheck-correction
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'huggingface_hub>=0.34' 'pandas>=2.2' 'pyarrow>=18'
      - name: Restore/cache Hugging Face source files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-intraday-${{ matrix.year }}
          restore-keys: hf-nifty-options-intraday-
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest tests/test_options_payoff.py tests/test_near_expiry_backtest.py tests/test_near_exit_extractor.py tests/test_intraday_selection.py
      - name: Build yearly intraday no-skip chunk
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: .
        run: |
          INPUT_START='${{ github.event.inputs.start || '2021-06-01' }}'
          INPUT_END='${{ github.event.inputs.end || '2026-08-31' }}'
          YEAR='${{ matrix.year }}'
          YEAR_START="${YEAR}-01-01"
          YEAR_END="${YEAR}-12-31"
          if [[ "$YEAR_START" < "$INPUT_START" ]]; then YEAR_START="$INPUT_START"; fi
          if [[ "$YEAR_END" > "$INPUT_END" ]]; then YEAR_END="$INPUT_END"; fi
          mkdir -p chunk
          if [[ "$YEAR_START" > "$YEAR_END" ]]; then
            echo 'No requested dates in this chunk.'
            exit 0
          fi
          python scripts/extract_intraday_near_exit_strategy.py \
            --start "$YEAR_START" \
            --end "$YEAR_END" \
            --entry-start-time '09:20' \
            --entry-end-time '15:29' \
            --download-workers 4 \
            --out-selected chunk/intraday_selected_near_exit.parquet \
            --out-scan-audit chunk/intraday_scan_audit.parquet \
            --out-decision-surface chunk/intraday_decision_surface.parquet
      - name: Upload yearly intraday chunk
        uses: actions/upload-artifact@v4
        with:
          name: phase9d-year-${{ matrix.year }}
          path: chunk/

  merge-and-backtest:
    needs: chunks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-9D-intraday-recheck-correction
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2' 'pyarrow>=18' 'numpy>=2.0'
      - name: Download yearly chunks
        uses: actions/download-artifact@v4
        with:
          pattern: phase9d-year-*
          path: chunks
          merge-multiple: false
      - name: Merge intraday chunks
        run: |
          mkdir -p data/derived
          python scripts/merge_intraday_chunks.py \
            --input-dir chunks \
            --out-selected data/derived/intraday_selected_near_exit.parquet \
            --out-audit data/derived/intraday_scan_audit.parquet \
            --out-surface data/derived/intraday_decision_surface.parquet
      - name: Unit-test merged outputs
        run: |
          python - <<'PY'
          import pandas as pd
          s=pd.read_parquet('data/derived/intraday_selected_near_exit.parquet')
          a=pd.read_parquet('data/derived/intraday_scan_audit.parquet')
          d=pd.read_parquet('data/derived/intraday_decision_surface.parquet')
          assert not s.empty and not a.empty and not d.empty
          assert s['near_expiry'].nunique() == len(s)
          assert (s['flatline_inr'] > 0).all()
          print({'selected':len(s),'weekly_cycles':s['near_expiry'].nunique(),'scan_rows':len(a),'decision_surface_rows':len(d)})
          PY
      - name: Primary corrected intraday H1
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_intraday_near_exit_backtest.py \
            --inputs data/derived/intraday_selected_near_exit.parquet \
            --out-dir results/phase9d_primary \
            --slippage-pct '${{ github.event.inputs.slippage_pct || '0.0025' }}' \
            --brokerage-per-order '${{ github.event.inputs.brokerage_per_order || '20' }}'
      - name: Execution sensitivity
        env:
          PYTHONPATH: .
        run: |
          for slip in 0 0.0025 0.005 0.01; do
            tag=$(python -c "print(str($slip).replace('.','p'))")
            python scripts/run_intraday_near_exit_backtest.py --inputs data/derived/intraday_selected_near_exit.parquet --out-dir results/phase9d_slip_${tag} --slippage-pct $slip --brokerage-per-order 20
          done
          for broker in 10 20 40; do
            python scripts/run_intraday_near_exit_backtest.py --inputs data/derived/intraday_selected_near_exit.parquet --out-dir results/phase9d_broker_${broker} --slippage-pct 0.0025 --brokerage-per-order $broker
          done
      - name: Verify 100 percent chart-positive selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('results/phase9d_primary/summary_intraday_near_exit.json').read_text())
          assert x['chart_positive_win_rate_pct'] == 100.0
          print(x)
          PY
      - name: Aggregate results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('results').glob('phase9d_*/summary_intraday_near_exit.json')):
              x=json.loads(p.read_text()); x['scenario']=str(p.parent); rows.append(x)
          Path('results/phase9d_summary.json').write_text(json.dumps(rows,indent=2,default=str))
          print(json.dumps(rows,indent=2,default=str))
          PY
      - name: Upload corrected intraday research
        uses: actions/upload-artifact@v4
        with:
          name: phase-9D-intraday-no-skip-recheck-chunked
          path: |
            data/derived/intraday_selected_near_exit.parquet
            data/derived/intraday_selected_near_exit.metadata.json
            data/derived/intraday_scan_audit.parquet
            data/derived/intraday_decision_surface.parquet
            results/phase9d_*/
            results/phase9d_summary.json
