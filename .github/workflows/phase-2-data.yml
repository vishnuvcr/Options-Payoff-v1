name: Phase 2 - Data acquisition and validation

on:
  push:
    branches: [phase-2-data]
  workflow_dispatch:
    inputs:
      start:
        description: Start date (YYYY-MM-DD)
        required: true
        default: '2021-06-01'
      end:
        description: End date (YYYY-MM-DD)
        required: true
        default: '2026-08-31'

permissions:
  contents: read
  actions: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data tooling
        run: |
          python -m pip install --upgrade pip
          pip install 'huggingface_hub>=0.34' 'pandas>=2.2' 'pyarrow>=18'
      - name: Restore/cache Hugging Face source files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-v1-${{ inputs.start }}-${{ inputs.end }}
          restore-keys: hf-nifty-options-v1-
      - name: Build strategy input table
        run: |
          python scripts/extract_strategy_inputs.py \
            --start '${{ inputs.start }}' \
            --end '${{ inputs.end }}' \
            --entry-time '09:20' \
            --out data/derived/strategy_inputs.parquet
      - name: Validate output
        run: |
          python -c "import pandas as pd; p='data/derived/strategy_inputs.parquet'; df=pd.read_parquet(p); assert not df.empty; assert df['entry_timestamp'].notna().all(); assert df['candidate_label'].isin(['ATM','ATM_MINUS_400','ATM_PLUS_400']).all(); print(df['status'].value_counts(dropna=False)); print(df.head(10).to_string())"
      - name: Upload Phase 2 data artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-strategy-inputs
          path: |
            data/derived/strategy_inputs.parquet
            data/derived/strategy_inputs.metadata.json
      - name: Chain to Phase 3
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run phase-3-backtest.yml --repo "${{ github.repository }}" --ref phase-3-backtest -f phase2_run_id="${{ github.run_id }}" -f start="${{ inputs.start }}" -f end="${{ inputs.end }}" -f trigger_base="buy_premium" -f configured_capital_per_lot="" -f slippage_pct="0.0025"
