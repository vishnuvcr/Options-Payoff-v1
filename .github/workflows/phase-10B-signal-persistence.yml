name: Phase 10B - Signal Persistence Confirmation
# Recovery trigger: rerun optimized year x delay extraction after cancelled run 36556610984

on:
  push:
    branches:
      - phase-10B-signal-persistence
    paths:
      - .github/workflows/phase-10B-signal-persistence.yml
      - scripts/extract_phase10b_confirmation_inputs.py
      - scripts/extract_phase10b_confirmation_year.py
      - scripts/analyze_phase10b_results.py
      - scripts/finalize_phase10b.py
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Frozen Phase 9G H1 yearly-artifact workflow run
        required: true
        default: '36313815542'
      bootstrap_reps:
        description: Paired bootstrap/permutation repetitions
        required: true
        default: '20000'

permissions:
  actions: read
  contents: write

concurrency:
  group: phase10b-signal-persistence
  cancel-in-progress: true

jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '36313815542' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'huggingface_hub>=0.34' 'pandas>=2.2' 'pyarrow>=18'
      - name: Restore cached Hugging Face source files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-intraday-${{ matrix.year }}
          restore-keys: hf-nifty-options-intraday-
      - name: Download frozen Phase 9G yearly H1 artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p source
          gh run download "$SOURCE_RUN_ID" -n phase9g-year-${{ matrix.year }} -D source
          test -f source/H1/intraday_scan_audit.parquet
          test -s source/H1/intraday_selected_trades.csv
      - name: Extract all confirmation horizons
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: .
        run: |
          mkdir -p out
          mkdir -p out
          python scripts/extract_phase10b_confirmation_year.py \
            --scan-audit source/H1/intraday_scan_audit.parquet \
            --start "${{ matrix.year }}-01-01" \
            --end "${{ matrix.year }}-12-31" \
            --delay-minutes 5 10 15 30 \
            --download-workers 4 \
            --out-dir out
      - name: Upload confirmation input
        uses: actions/upload-artifact@v4
        with:
          name: phase10b-year-${{ matrix.year }}
          path: out/

  merge:
    needs: extract
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '36313815542' }}
      BOOTSTRAP_REPS: ${{ github.event.inputs.bootstrap_reps || '20000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: pip install pandas numpy scipy pyarrow tabulate
      - name: Download confirmation inputs
        uses: actions/download-artifact@v4
        with:
          pattern: phase10b-year-*
          path: confirmation
          merge-multiple: false
      - name: Download frozen Phase 9G H1 yearly artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p phase9g
          gh run download "$SOURCE_RUN_ID" -n phase9g-year-2021 -D phase9g/year2021
          gh run download "$SOURCE_RUN_ID" -n phase9g-year-2022 -D phase9g/year2022
          gh run download "$SOURCE_RUN_ID" -n phase9g-year-2023 -D phase9g/year2023
          gh run download "$SOURCE_RUN_ID" -n phase9g-year-2024 -D phase9g/year2024
          gh run download "$SOURCE_RUN_ID" -n phase9g-year-2025 -D phase9g/year2025
          gh run download "$SOURCE_RUN_ID" -n phase9g-year-2026 -D phase9g/year2026
      - name: Build raw control and confirmation ledgers
        run: |
          rm -rf inputs
          mkdir -p inputs
          for delay in 5 10 15 30; do
            first=1
            rm -f "inputs/phase10b_${delay}m.csv"
            while IFS= read -r f; do
              if [ "$first" -eq 1 ]; then
                cat "$f" > "inputs/phase10b_${delay}m.csv"
                first=0
              else
                tail -n +2 "$f" >> "inputs/phase10b_${delay}m.csv"
              fi
            done < <(find confirmation -name "phase10b_${delay}m.csv" -type f | sort)
          done
          python - <<'PY'
          import glob
          import pandas as pd
          files = sorted(glob.glob("phase9g/year*/H1/intraday_selected.parquet"))
          if len(files) != 6:
              raise SystemExit(f"Expected 6 frozen Phase 9G H1 parquet files, found {len(files)}")
          frames = [pd.read_parquet(f) for f in files]
          control = pd.concat(frames, ignore_index=True)
          control.to_csv("inputs/phase9g_control.csv", index=False)
          if len(control) != 131:
              raise SystemExit(f"Frozen Phase 9G control must contain 131 rows, found {len(control)}")
          required = {"flatline_inr","near_call_close","near_put_close","far_call_close","far_put_close","near_settlement","far_call_exit_close","far_put_exit_close"}
          missing = required - set(control.columns)
          if missing:
              raise SystemExit(f"Frozen Phase 9G parquet missing required fields: {sorted(missing)}")
          print(f"validated frozen control rows={len(control)}")
          PY
          wc -l inputs/phase9g_control.csv inputs/phase10b_*.csv
      - name: Run realized-P&L backtests
        run: |
          rm -rf results/phase10b
          mkdir -p results/phase10b
          python scripts/run_intraday_near_exit_backtest.py --inputs inputs/phase9g_control.csv --out-dir results/phase10b/control --slippage-pct 0.0025 --brokerage-per-order 20
          for delay in 5 10 15 30; do
            python scripts/run_intraday_near_exit_backtest.py               --inputs "inputs/phase10b_${delay}m.csv"               --out-dir "results/phase10b/${delay}m"               --slippage-pct 0.0025               --brokerage-per-order 20
          done
      - name: Analyze confirmation variants
        run: |
          python scripts/analyze_phase10b_results.py             --control inputs/phase9g_control.csv             --results-dir results/phase10b             --bootstrap-reps "$BOOTSTRAP_REPS"             --out-dir results/phase10b
      - name: Upload Phase 10B evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase10b-signal-persistence
          path: results/phase10b
      - name: Finalize repository status and logs
        run: |
          python scripts/finalize_phase10b.py
          git add results/phase10b research/STATUS.md research/ACTIVITY_LOG.md research/ERROR_LOG.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase 10B: publish signal-persistence results"
          git push origin HEAD:phase-10B-signal-persistence
      - name: Log workflow failure
        if: failure()
        run: |
          echo "| $(date -u +%F) | 10B | Workflow failure | Phase 10B failed before completion. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID | No empirical conclusion accepted from this failed run. | Inspect and correct before rerun. |" >> research/ERROR_LOG.md
          git add research/ERROR_LOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          git commit -m "Phase 10B: log failed workflow" || true
          git push origin HEAD:phase-10B-signal-persistence || true
