name: Phase 9G - H2 H3 Far Expiry Selection

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First calendar year to reconstruct
        required: true
        default: '2021'
      end_year:
        description: Last calendar year to reconstruct
        required: true
        default: '2026'
      bootstrap_reps:
        description: Bootstrap/permutation repetitions
        required: true
        default: '20000'
  push:
    branches:
      - phase-9G-h2-h3-far-expiry-selection
    paths:
      - .github/workflows/phase-9G-h2-h3-far-expiry-selection.yml
      - scripts/extract_intraday_far_horizon_strategy.py
      - scripts/merge_phase9g_results.py
      - scripts/run_intraday_near_exit_backtest.py
      - scripts/audit_h1_candidate_completeness.py

permissions:
  actions: read
  contents: write

concurrency:
  group: phase-9G-h2-h3-far-expiry-selection
  cancel-in-progress: true

jobs:
  h1-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pandas pyarrow
      - name: Download authoritative Phase 9D H1 artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p h1_artifact
          gh run download 36302077730 -n phase-9D-final-H1-evidence -D h1_artifact
      - name: Audit selected timestamps for all 17 strikes
        run: |
          python scripts/audit_h1_candidate_completeness.py \
            --audit h1_artifact/data/derived/intraday_scan_audit.parquet \
            --selected h1_artifact/data/derived/intraday_selected_near_exit.parquet \
            --out results/phase9g_h1_17_strike_audit
      - name: Upload H1 completeness evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase9g-h1-17-strike-audit
          path: results/phase9g_h1_17_strike_audit

  yearly-reconstruction:
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pandas numpy scipy pyarrow huggingface_hub openpyxl tabulate
      - name: Cache Hugging Face option data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase9g-hf-options-${{ matrix.year }}-${{ hashFiles('scripts/extract_intraday_far_horizon_strategy.py') }}
          restore-keys: |
            phase9g-hf-options-${{ matrix.year }}-
      - name: Reconstruct H1 H2 H3 decision surfaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p work/${{ matrix.year }}
          for rank in 1 2 3; do
            mkdir -p work/${{ matrix.year }}/H${rank}
            python scripts/extract_intraday_far_horizon_strategy.py \
              --start "${{ matrix.year }}-01-01" \
              --end "${{ matrix.year }}-12-31" \
              --entry-start-time 09:20 \
              --entry-end-time 15:29 \
              --far-rank ${rank} \
              --out-selected "work/${{ matrix.year }}/H${rank}/intraday_selected.parquet" \
              --out-scan-audit "work/${{ matrix.year }}/H${rank}/intraday_scan_audit.parquet" \
              --out-decision-surface "work/${{ matrix.year }}/H${rank}/intraday_decision_surface.parquet"
            python scripts/run_intraday_near_exit_backtest.py \
              --inputs "work/${{ matrix.year }}/H${rank}/intraday_selected.parquet" \
              --out-dir "work/${{ matrix.year }}/H${rank}"
          done
      - name: Upload yearly horizon evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase9g-year-${{ matrix.year }}
          path: work/${{ matrix.year }}

  merge-and-test:
    needs: [yearly-reconstruction, h1-completeness]
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pandas numpy scipy pyarrow tabulate
      - name: Download all yearly horizon artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: phase9g-year-*
          merge-multiple: false
          path: phase9g_evidence
      - name: Merge and test horizons
        run: python scripts/merge_phase9g_results.py --evidence-dir phase9g_evidence --out-dir results/phase9g --bootstrap-reps "${{ github.event.inputs.bootstrap_reps || '20000' }}"
      - name: Upload Phase 9G evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-9G-h2-h3-evidence-pre-sensitivity
          path: results/phase9g
      - name: Validate raw quote fields before execution-cost sensitivity
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          required = ['near_call_close','near_put_close','far_call_close','far_put_close','near_settlement','far_call_exit_close','far_put_exit_close','near_lot_size','far_lot_size']
          for p in Path('results/phase9g').glob('H*_realized_trades.csv'):
              df = pd.read_csv(p)
              missing = [c for c in required if c not in df.columns]
              if missing:
                  raise SystemExit(f'{p}: missing raw quote fields: {missing}')
          print('All realized ledgers retain required raw quote fields.')
          PY
      - name: Execution-cost sensitivity
        run: |
          for h in 1 2 3; do
            for slip in 0.0025 0.005 0.01; do
              python scripts/run_intraday_near_exit_backtest.py --inputs "results/phase9g/H${h}_realized_trades.csv" --out-dir "results/phase9g/sensitivity_H${h}_${slip}" --slippage-pct ${slip} --brokerage-per-order 20
              cp "results/phase9g/sensitivity_H${h}_${slip}/summary_intraday_near_exit.json" "results/phase9g/sensitivity_H${h}_${slip}.json"
            done
            for broker in 10 40; do
              python scripts/run_intraday_near_exit_backtest.py --inputs "results/phase9g/H${h}_realized_trades.csv" --out-dir "results/phase9g/sensitivity_H${h}_broker_${broker}" --slippage-pct 0.0025 --brokerage-per-order ${broker}
              cp "results/phase9g/sensitivity_H${h}_broker_${broker}/summary_intraday_near_exit.json" "results/phase9g/sensitivity_H${h}_broker_${broker}.json"
            done
          done
      - name: Rebuild summary with sensitivity
        run: python scripts/merge_phase9g_results.py --evidence-dir phase9g_evidence --out-dir results/phase9g --bootstrap-reps "${{ github.event.inputs.bootstrap_reps || '20000' }}"
      - name: Upload final Phase 9G evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-9G-h2-h3-evidence
          path: results/phase9g
      - name: Persist Phase 9G results
        run: |
          git add results/phase9g
          if git diff --cached --quiet; then echo 'No result changes'; exit 0; fi
          git commit -m 'Add Phase 9G H2 H3 selection results'
          git fetch origin phase-9G-h2-h3-far-expiry-selection
          git rebase origin/phase-9G-h2-h3-far-expiry-selection
          git push origin phase-9G-h2-h3-far-expiry-selection