name: Phase 7B - Weekly Maximum Positive Flatline

on:
  push:
    branches:
      - phase-7B-weekly-cadence
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Phase 3 run containing candidate_results.parquet
        required: true
        default: '36262958536'

concurrency:
  group: phase-7B-weekly-positive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  weekly-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install 'pandas>=2.2' 'pyarrow>=18'
      - name: Download Phase 3 expanded strategy inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/phase2_source
          gh run download '36262958536' \
            --repo '${{ github.repository }}' \
            --name phase-3-expanded-strategy-inputs \
            --dir data/phase3_source
          test -s data/phase3_source/strategy_inputs.parquet
      - name: Compute all 17-strike payoff metrics with no threshold gate
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_backtest.py \
            --inputs data/phase3_source/strategy_inputs.parquet \
            --out-dir results/phase7b_metrics \
            --selection-mode max_equal_flatline \
            --selection-score equal_max_profit_loss_inr \
            --selection-max-shift-points 400 \
            --selection-step-points 50 \
            --min-chart-return-pct 0.0 \
            --slippage-pct 0.0025
          test -s results/phase7b_metrics/candidate_results.parquet
      - name: Primary weekly selection at first positive opportunity
        run: |
          python scripts/weekly_positive_selection.py \
            --inputs results/phase7b_metrics/candidate_results.parquet \
            --out-dir results/phase7b_weekly \
            --observation first_positive
      - name: First-observation weekly timing sensitivity
        run: |
          python scripts/weekly_positive_selection.py \
            --inputs results/phase7b_metrics/candidate_results.parquet \
            --out-dir results/phase7b_weekly \
            --observation first_observation
      - name: Last-observation weekly timing sensitivity
        run: |
          python scripts/weekly_positive_selection.py \
            --inputs results/phase7b_metrics/candidate_results.parquet \
            --out-dir results/phase7b_weekly \
            --observation last_observation
      - name: Best-positive-in-week oracle sensitivity
        run: |
          python scripts/weekly_positive_selection.py \
            --inputs results/phase7b_metrics/candidate_results.parquet \
            --out-dir results/phase7b_weekly \
            --observation max_in_week
      - name: Validate weekly coverage and positive rule
        run: |
          python - <<'PY'
          import json, pathlib
          for obs in ('first_positive','first_observation','last_observation','max_in_week'):
              p=pathlib.Path(f'results/phase7b_weekly/weekly_summary_{obs}.json')
              x=json.loads(p.read_text())
              print(obs,x)
              assert x['selected_trades'] > 0
          primary=json.loads(pathlib.Path('results/phase7b_weekly/weekly_summary_first_positive.json').read_text())
          assert primary['weeks_without_positive_candidate'] == 0
          assert primary['non_positive_selected_trades'] == 0
          assert primary['selected_trades'] > 0
          PY
      - name: Slippage sensitivity for the primary weekly rule
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results/phase7b_slippage
          for s in 0 0.0025 0.005 0.01; do
            tag=$(echo "$s" | tr '.' '_')
            python scripts/run_backtest.py \
              --inputs data/phase3_source/strategy_inputs.parquet \
              --out-dir "results/phase7b_slippage/metrics_${tag}" \
              --selection-mode max_equal_flatline \
              --selection-score equal_max_profit_loss_inr \
              --selection-max-shift-points 400 \
              --selection-step-points 50 \
              --min-chart-return-pct 0.0 \
              --slippage-pct "$s"
            python scripts/weekly_positive_selection.py \
              --inputs "results/phase7b_slippage/metrics_${tag}/candidate_results.parquet" \
              --out-dir "results/phase7b_slippage/weekly_${tag}" \
              --observation first_positive
          done
      - name: Upload weekly results
        uses: actions/upload-artifact@v4
        with:
          name: phase-7B-weekly-positive-selection
          path: results/phase7b_weekly
