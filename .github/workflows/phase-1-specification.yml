name: Phase 1 - Specification tests

on:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Phase 1 tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
