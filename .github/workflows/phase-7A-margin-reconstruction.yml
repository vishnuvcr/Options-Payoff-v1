name: Phase 7A - Historical Margin Reconstruction

on:
  push:
    branches:
      - phase-7A-margin-reconstruction
  workflow_dispatch:
    inputs:
      trade_date:
        description: Historical trade date used for calibration
        required: true
        default: '2026-09-25'
      target_margin:
        description: Sensibull standalone margin shown in the user screenshot
        required: true
        default: '88076'
      spot:
        description: NIFTY spot shown in the screenshot
        required: true
        default: '23140.50'

concurrency:
  group: phase-7A-margin-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install margin tooling
        run: |
          python -m pip install --upgrade pip
          pip install 'marginism==0.1.1' 'requests>=2.31'

      - name: Download all NSE SPAN intraday versions for calibration
        run: |
          mkdir -p data/margin/span/${{ inputs.trade_date || '2026-09-25' }}
          DATE=$(echo '${{ inputs.trade_date || '2026-09-25' }}' | tr -d '-')
          for v in 5 4 3 2 1; do
            url="https://nsearchives.nseindia.com/archives/nsccl/span/nsccl.${DATE}.i${v}.zip"
            curl --fail --silent --show-error --location \
              -H 'User-Agent: Mozilla/5.0' \
              -H 'Accept: application/octet-stream,*/*;q=0.8' \
              -H 'Referer: https://www.nseindia.com/' \
              "$url" -o "/tmp/nsccl_i${v}.zip"
            unzip -jo "/tmp/nsccl_i${v}.zip" '*.spn' -d data/margin/span/${{ inputs.trade_date || '2026-09-25' }}
          done
          url="https://nsearchives.nseindia.com/archives/nsccl/span/nsccl.${DATE}.s.zip"
          echo "Downloading $url"
          if curl --fail --silent --show-error --location \
              -H 'User-Agent: Mozilla/5.0' \
              -H 'Accept: application/octet-stream,*/*;q=0.8' \
              -H 'Referer: https://www.nseindia.com/' \
              "$url" -o "/tmp/nsccl_s.zip"; then
            unzip -jo "/tmp/nsccl_s.zip" '*.spn' -d data/margin/span/${{ inputs.trade_date || '2026-09-25' }}
          fi
          ls -lh data/margin/span/${{ inputs.trade_date || '2026-09-25' }}

      - name: Reconstruct screenshot position margin
        run: |
          SPN=$(find data/margin/span/${{ inputs.trade_date || '2026-09-25' }} -type f -name '*.spn' | sort | tail -n 1)
          test -n "$SPN"
          python scripts/reconstruct_screenshot_margin.py \
            --span-file "$SPN" \
            --date '${{ inputs.trade_date || '2026-09-25' }}' \
            --target-margin '${{ inputs.target_margin || '88076' }}' \
            --spot '${{ inputs.spot || '23140.50' }}' \
            --out results/margin_calibration_2026-09-25.json

      - name: Compare all published intraday versions
        run: |
          python scripts/reconstruct_margin_versions.py \
            --span-dir data/margin/span/${{ inputs.trade_date || '2026-09-25' }} \
            --date '${{ inputs.trade_date || '2026-09-25' }}' \
            --target-margin '${{ inputs.target_margin || '88076' }}' \
            --out results/margin_calibration_versions_2026-09-25.json

      - name: Reconstruct screenshot position margin
        run: |
          SPN=$(find data/margin/span -type f -name '*.spn' | head -n 1)
          test -n "$SPN"
          python scripts/reconstruct_screenshot_margin.py \
            --span-file "$SPN" \
            --date '${{ inputs.trade_date || '2026-09-25' }}' \
            --target-margin '${{ inputs.target_margin || '88076' }}' \
            --spot '${{ inputs.spot || '23140.50' }}' \
            --out results/margin_calibration_2026-09-25.json

      - name: Validate calibration report
        run: |
          python - <<'PY'
          import json
          x=json.load(open('results/margin_calibration_2026-09-25.json'))
          v=json.load(open('results/margin_calibration_versions_2026-09-25.json'))
          print(json.dumps(x, indent=2))
          print(json.dumps(v, indent=2))
          assert x['screenshot_target_margin_inr'] == 88076.0
          assert x['lot_size'] == 65
          assert x['spot_notional_inr'] > 0
          assert v['versions']
          assert min(r['absolute_difference_inr'] for r in v['versions']) < 2000
          PY

      - name: Upload calibration outputs
        uses: actions/upload-artifact@v4
        with:
          name: phase-7A-margin-calibration
          path: |
            results/margin_calibration_2026-09-25.json
            results/margin_calibration_versions_2026-09-25.json
