name: Phase 10D - Exit Timing

on:
  push:
    branches:
      - phase-10D-exit-timing
    paths:
      - .github/workflows/phase-10D-exit-timing.yml
      - scripts/run_phase10d_exit_timing.py
      - scripts/analyze_phase10d_results.py
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Frozen Phase 9G H1 yearly-artifact workflow
        required: true
        default: "36313815542"
      bootstrap_reps:
        description: Paired bootstrap/permutation repetitions
        required: true
        default: "20000"

permissions:
  actions: read
  contents: write

concurrency:
  group: phase10d-exit-timing
  cancel-in-progress: true

jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '36313815542' }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install "huggingface_hub>=0.34" "pandas>=2.2" "pyarrow>=18" "numpy>=2" "scipy>=1.11"
      - name: Restore cached source
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-intraday-${{ matrix.year }}
          restore-keys: hf-nifty-options-intraday-
      - name: Download frozen selected trades
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p source
          gh run download "$SOURCE_RUN_ID" -n phase9g-year-${{ matrix.year }} -D source
          test -s source/H1/intraday_selected_trades.csv
      - name: Run exit timing candidates
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p out
          python scripts/run_phase10d_exit_timing.py \
            --selected source/H1/intraday_selected_trades.csv \
            --start "${{ matrix.year }}-01-01" \
            --end "${{ matrix.year }}-12-31" \
            --download-workers 4 \
            --slippage-pct 0.0025 \
            --brokerage-per-order 20 \
            --out-dir out
      - uses: actions/upload-artifact@v4
        with:
          name: phase10d-year-${{ matrix.year }}
          path: out/

  merge:
    needs: extract
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '36313815542' }}
      BOOTSTRAP_REPS: ${{ github.event.inputs.bootstrap_reps || '20000' }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: pip install pandas numpy scipy pyarrow tabulate
      - uses: actions/download-artifact@v4
        with:
          pattern: phase10d-year-*
          path: exitdata
          merge-multiple: false
      - name: Merge yearly ledgers
        run: |
          mkdir -p results/phase10d
          python - <<'PY'
          import glob,pandas as pd
          files=sorted(glob.glob("exitdata/*/exit_timing_trade_ledger.csv"))
          if len(files)!=6: raise SystemExit(f"Expected six yearly ledgers, found {len(files)}")
          d=pd.concat([pd.read_csv(f) for f in files],ignore_index=True)
          d.to_csv("results/phase10d/exit_timing_trade_ledger.csv",index=False)
          print(d.groupby(["variant","status"]).size())
          PY
      - name: Analyze
        run: |
          python scripts/analyze_phase10d_results.py \
            --ledger results/phase10d/exit_timing_trade_ledger.csv \
            --out-dir results/phase10d \
            --bootstrap-reps "$BOOTSTRAP_REPS"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: phase10d-exit-timing
          path: results/phase10d/
      - name: Finalize repository
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path(".");res=root/"results/phase10d";promo=json.loads((res/"promotion_screen.json").read_text())
          stamp="2026-09-29"
          (root/"research"/"STATUS.md").write_text((root/"research"/"STATUS.md").read_text()+f"\n## Phase 10D — exit timing\n\n**Status:** COMPLETE — no strategy change adopted.\n\n- [Phase 10D results](../results/phase10d/PHASE10D_RESULTS.md)\n- [Exit timing summary](../results/phase10d/exit_timing_summary.csv)\n- [Paired comparisons](../results/phase10d/paired_exit_timing_comparisons.csv)\n- Promotion screen: {promo['passed']}\n")
          (root/"research"/"ACTIVITY_LOG.md").write_text((root/"research"/"ACTIVITY_LOG.md").read_text()+f"\n| {stamp} | 10D | Exit timing | Tested near-expiry, 60/120/180-minute early exits and previous-trading-day exit with all four legs closed. |\n")
          (root/"research"/"ERROR_LOG.md").write_text((root/"research"/"ERROR_LOG.md").read_text()+f"\n| {stamp} | 10D | Execution convention | Early-exit costs were recomputed for all four closing transactions; no exercise STT was applied. | Documented in Phase 10D results. |\n")
          readme=root/"README.md"; readme.write_text(readme.read_text()+f"\n## Phase 10D — exit timing\n\n**Complete; no strategy change adopted.** [Results](results/phase10d/PHASE10D_RESULTS.md) · [Summary](results/phase10d/exit_timing_summary.csv) · Promotion screen: **{promo['passed']}**\n")
          PY
          git add results/phase10d research/STATUS.md research/ACTIVITY_LOG.md research/ERROR_LOG.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 10D: publish exit timing results" || true
          git push origin HEAD:phase-10D-exit-timing
      - name: Log failure
        if: failure()
        run: |
          echo "| $(date -u +%F) | 10D | Workflow failure | Phase 10D failed before completion. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID | No empirical conclusion accepted. | Inspect and rerun. |" >> research/ERROR_LOG.md
          git add research/ERROR_LOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 10D: log failed workflow" || true
          git push origin HEAD:phase-10D-exit-timing || true
