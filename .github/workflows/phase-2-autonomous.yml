name: Phase 2 - Autonomous execution

on:
  push:
    branches: [phase-2-data]
    paths:
      - '.github/workflows/phase-2-autonomous.yml'
      - 'scripts/extract_strategy_inputs.py'
      - 'data/SOURCE_MANIFEST.json'
      - 'docs/PHASE_2_DATA_PLAN.md'

permissions:
  actions: read
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data tooling
        run: |
          python -m pip install --upgrade pip
          pip install 'huggingface_hub>=0.34' 'pandas>=2.2' 'pyarrow>=18'
      - name: Restore/cache Hugging Face source files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-autonomous-2021-06-01-2026-08-31
          restore-keys: hf-nifty-options-autonomous-
      - name: Build strategy input table
        run: |
          python scripts/extract_strategy_inputs.py --start '2021-06-01' --end '2026-08-31' --entry-time '09:20' --out data/derived/strategy_inputs.parquet
      - name: Validate output
        run: |
          python - <<'PY'
          import pandas as pd
          p='data/derived/strategy_inputs.parquet'
          df=pd.read_parquet(p)
          assert not df.empty
          assert df['entry_timestamp'].notna().all()
          assert df['candidate_label'].isin(['ATM','ATM_MINUS_400','ATM_PLUS_400']).all()
          print(df['status'].value_counts(dropna=False))
          PY
      - name: Upload Phase 2 data artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-strategy-inputs
          path: |
            data/derived/strategy_inputs.parquet
            data/derived/strategy_inputs.metadata.json
      - name: Chain to Phase 3
        if: success()
        run: |
          git fetch origin phase-3-backtest
          git switch --detach origin/phase-3-backtest
          printf '{"phase2_run_id":"%s","start_date":"2021-06-01","end_date":"2026-08-31","trigger_base":"buy_premium","configured_capital":"","slippage_pct":"0.0025"}\n' "${GITHUB_RUN_ID}" > .github/phase2_trigger.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/phase2_trigger.json
          git commit -m "Trigger Phase 3 from Phase 2 run ${GITHUB_RUN_ID}"
          git push origin HEAD:phase-3-backtest
