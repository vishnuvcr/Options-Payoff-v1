name: Phase 9I Top Two Merge Only

on:
  workflow_dispatch:
  push:
    branches:
      - phase-9I-top-two-strikes
    paths:
      - 'scripts/merge_phase9i_top_two_fast.py'
      - '.github/workflows/phase-9I-top-two-merge-only.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: phase9i-top-two-merge-only-v1
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pandas numpy tabulate
      - name: Download completed Phase 9I yearly artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p evidence baseline
          for name in 2021 2022 2023 2024 2025 2026; do
            gh run download 36428410493 -n phase9i-fast-year-$name -D evidence/$name
          done
          gh run download 36320697995 -n phase9g-run27-merged-results -D baseline
      - name: Merge and validate
        run: |
          python scripts/merge_phase9i_top_two_fast.py             --input-dir evidence             --baseline baseline/H1_realized_trades.csv             --out-dir results/phase9i_fast
      - name: Upload final results
        uses: actions/upload-artifact@v4
        with:
          name: phase9i-top-two-final
          path: results/phase9i_fast
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase9i_fast
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Phase 9I top-two final results"
          git fetch origin phase-9I-top-two-strikes
          git rebase origin/phase-9I-top-two-strikes
          git push origin phase-9I-top-two-strikes
