name: Phase 9H - Loss Trade Entry Analysis

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First calendar year to analyze
        required: true
        default: '2021'
      end_year:
        description: Last calendar year to analyze
        required: true
        default: '2026'
  push:
    branches:
      - phase-9H-loss-entry-analysis
    paths:
      - .github/workflows/phase-9H-loss-entry-analysis.yml
      - scripts/analyze_phase9h_loss_entries.py
      - scripts/merge_phase9h_loss_entry_analysis.py

permissions:
  actions: read
  contents: write

concurrency:
  group: phase-9H-loss-entry-analysis-v1
  cancel-in-progress: true

jobs:
  yearly-analysis:
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pandas numpy scipy pyarrow huggingface_hub tabulate
      - name: Cache Hugging Face option data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase9h-hf-options-${{ matrix.year }}-${{ hashFiles('scripts/analyze_phase9h_loss_entries.py') }}
          restore-keys: |
            phase9g-hf-options-${{ matrix.year }}-
            phase9h-hf-options-${{ matrix.year }}-
      - name: Analyze losses and entry perturbations
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p work/${{ matrix.year }}
          python scripts/analyze_phase9h_loss_entries.py \
            --start "${{ matrix.year }}-01-01" \
            --end "${{ matrix.year }}-12-31" \
            --entry-start-time 09:20 \
            --entry-end-time 15:29 \
            --slippage-pct 0.0025 \
            --brokerage-per-order 20 \
            --out-dir "work/${{ matrix.year }}"
      - name: Upload yearly analysis
        uses: actions/upload-artifact@v4
        with:
          name: phase9h-year-${{ matrix.year }}
          path: work/${{ matrix.year }}

  merge-results:
    needs: yearly-analysis
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pandas numpy scipy pyarrow tabulate
      - name: Download yearly Phase 9H artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: phase9h-year-*
          merge-multiple: false
          path: phase9h_evidence
      - name: Merge loss-entry analysis
        run: |
          python scripts/merge_phase9h_loss_entry_analysis.py \
            --input-dir phase9h_evidence \
            --out-dir results/phase9h
      - name: Upload Phase 9H results
        uses: actions/upload-artifact@v4
        with:
          name: phase-9H-loss-entry-analysis
          path: results/phase9h
      - name: Persist Phase 9H results
        run: |
          git add results/phase9h
          if git diff --cached --quiet; then echo 'No result changes'; exit 0; fi
          git commit -m 'Add Phase 9H loss-entry analysis results'
          git fetch origin phase-9H-loss-entry-analysis
          git rebase origin/phase-9H-loss-entry-analysis
          git push origin phase-9H-loss-entry-analysis
