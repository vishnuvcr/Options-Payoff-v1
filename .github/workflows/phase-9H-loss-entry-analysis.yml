name: Phase 9H - Loss Trade Entry Analysis

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First calendar year to analyze
        required: true
        default: '2021'
      end_year:
        description: Last calendar year to analyze
        required: true
        default: '2026'
  push:
    branches:
      - phase-9H-loss-entry-analysis
    paths:
      - .github/workflows/phase-9H-loss-entry-analysis.yml
      - scripts/analyze_phase9h_loss_cycles.py
      - scripts/merge_phase9h_loss_cycles.py

permissions:
  actions: read
  contents: write

concurrency:
  group: phase-9H-loss-entry-analysis-v1
  cancel-in-progress: true

jobs:
  yearly-loss-analysis:
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pandas numpy scipy pyarrow huggingface_hub tabulate
      - name: Cache Phase 9G Hugging Face option data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase9h-loss-hf-${{ matrix.year }}-${{ hashFiles('scripts/analyze_phase9h_loss_cycles.py') }}
          restore-keys: |
            phase9g-hf-options-${{ matrix.year }}-
            phase9h-loss-hf-${{ matrix.year }}-
      - name: Download frozen Phase 9G loss ledger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pooled
          gh run download 36320697995 -n phase9g-run27-merged-results -D pooled
      - name: Download frozen Phase 9G scan audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf phase9g_year
          gh run download 36313815542 -n phase9g-year-${{ matrix.year }} -D phase9g_year
      - name: Analyze only realized-loss cycles
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('pooled/H1_realized_trades.csv')
          year=${{ matrix.year }}
          d=d[pd.to_datetime(d['entry_date']).dt.year.eq(year) & d['net_pnl_inr'].lt(0)]
          d.to_csv('losses_year.csv',index=False)
          print('loss rows:',len(d))
          PY
          python scripts/analyze_phase9h_loss_cycles.py \
            --losses losses_year.csv \
            --scan-audit phase9g_year/H1/intraday_scan_audit.parquet \
            --start "${{ matrix.year }}-01-01" \
            --end "${{ matrix.year }}-12-31" \
            --out-dir work/${{ matrix.year }} \
            --slippage-pct 0.0025 \
            --brokerage-per-order 20
      - name: Validate baseline P&L against frozen Phase 9G ledger
        run: |
          python - <<'PY'
          import pandas as pd
          expected=pd.read_csv('losses_year.csv')[['entry_timestamp','net_pnl_inr']].rename(columns={'net_pnl_inr':'expected'})
          actual=pd.read_csv('work/${{ matrix.year }}/loss_trade_entry_detail.csv')[['entry_timestamp','baseline_net_pnl_inr']]
          m=expected.merge(actual,on='entry_timestamp',how='outer',validate='one_to_one')
          if m.expected.isna().any() or m.baseline_net_pnl_inr.isna().any():
              raise SystemExit('Baseline loss ledger coverage mismatch')
          err=(m.expected-m.baseline_net_pnl_inr).abs()
          print('max baseline P&L difference:',float(err.max()))
          if float(err.max())>1e-6:
              raise SystemExit('Phase 9H baseline P&L does not reproduce frozen Phase 9G loss ledger')
          PY
      - name: Upload yearly loss analysis
        uses: actions/upload-artifact@v4
        with:
          name: phase9h-loss-year-${{ matrix.year }}
          path: work/${{ matrix.year }}

  merge-results:
    needs: yearly-loss-analysis
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pandas tabulate
      - name: Download yearly Phase 9H loss artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: phase9h-loss-year-*
          merge-multiple: false
          path: phase9h_evidence
      - name: Merge Phase 9H loss results
        run: |
          python scripts/merge_phase9h_loss_cycles.py \
            --input-dir phase9h_evidence \
            --out-dir results/phase9h
      - name: Upload Phase 9H results
        uses: actions/upload-artifact@v4
        with:
          name: phase-9H-loss-entry-analysis
          path: results/phase9h
      - name: Persist Phase 9H results
        run: |
          git add results/phase9h
          if git diff --cached --quiet; then echo 'No result changes'; exit 0; fi
          git commit -m 'Add Phase 9H loss-entry results'
          git fetch origin phase-9H-loss-entry-analysis
          git rebase origin/phase-9H-loss-entry-analysis
          git push origin phase-9H-loss-entry-analysis
